<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="rgb(30, 31, 31)" />
    <meta name="author" content="spookydoodle" />
    <meta name="description" content="The Dead Planet's Machine Ward" />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="/fonts.css" />
    <title>The Dead Planet's Machine Ward</title>
    <style>
        body {
            margin: 0;
            background-color: var(--startup-background, rgb(30, 31, 31));
            color: var(--startup-color, rgb(224, 224, 224));
        }

        #startup-placeholder {
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 100svh;
            flex: 1;
            align-items: center;
            justify-content: center;
            background-color: var(--startup-background, rgb(30, 31, 31));
            color: var(--startup-color, rgb(224, 224, 224));
            font-family: "Syne Mono", monospace;
        }

        #startup-placeholder p {
            margin: 0;
        }

        #startup-manifest {
            max-width: min(32rem, 100%);
        }

        #startup-manifest-title {
            margin: 0 0 12px;
            font-size: 0.875rem;
            font-weight: 400;
            line-height: 1.5;
        }

        #startup-progress {
            height: 16em;
            margin: 0;
            padding: 0;
            overflow: auto;
            list-style: none;
            font-size: 0.75rem;
            line-height: 1.5;
        }

        #startup-progress li {
            display: grid;
            grid-template-columns: 1.5em 1fr;
            align-items: start;
            gap: 0.75em;
            margin-bottom: 0.5em;
        }

        #startup-progress [role="img"] {
            text-align: center;
            font-family: Arial, sans-serif;
            font-weight: 700;
        }

    </style>
    <script data-themes="<%= startupThemes %>" data-default-theme="<%= defaultThemeName %>">
        (() => {
            const themes = JSON.parse(document.currentScript.dataset.themes);
            const defaultThemeName = document.currentScript.dataset.defaultTheme;
            let settings;
            try {
                settings = JSON.parse(localStorage.getItem('application-settings'));
            } catch { }
            const themeName = Object.hasOwn(themes, settings?.themeName) ? settings.themeName : defaultThemeName;
            const mode = settings?.themeMode === 'light' ? 'light' : 'dark';
            const colors = themes[themeName][mode];
            document.documentElement.style.setProperty('--startup-background', colors.background);
            document.documentElement.style.setProperty('--startup-color', colors.color);
            document.querySelector('meta[name="theme-color"]').content = colors.background;
        })();
    </script>
</head>

<body>
    <div id="app">
        <div id="startup-placeholder">
            <p id="startup-message"><%= startupWelcome %></p>
            <section id="startup-manifest">
                <h1 id="startup-manifest-title"><%= startupTitle %></h1>
                <ul id="startup-progress" aria-labelledby="startup-manifest-title" aria-live="polite"></ul>
            </section>
        </div>
    </div>
    <script data-messages="<%= startupMessages %>">
        (() => {
            const messages = JSON.parse(document.currentScript.dataset.messages);
            let savedLanguage;
            try {
                savedLanguage = JSON.parse(localStorage.getItem('application-settings'))?.language;
            } catch { }
            const locale = Intl.DateTimeFormat().resolvedOptions().locale.toLowerCase().split(/[-_]/)[0];
            const language = typeof savedLanguage === 'string' && Object.hasOwn(messages, savedLanguage) && messages[savedLanguage].language === savedLanguage
                ? savedLanguage
                : Object.hasOwn(messages, locale) ? locale : 'en';
            const message = messages[language];
            document.documentElement.lang = message.locale;
            document.getElementById('startup-message').textContent = message.welcome;
            document.getElementById('startup-manifest-title').textContent = message.title;
            const progress = document.getElementById('startup-progress');
            const loaded = new Set();
            const failed = new Set();
            const indicators = new Map();
            const symbols = {
                pending: '⏳',
                downloaded: '✓',
                failed: '!',
            };
            const resourceObserver = typeof PerformanceObserver === 'function' ? new PerformanceObserver(updateProgress) : null;
            const bundleLabels = {
                'vendors-react': message.runtime,
                'react-vendors': message.runtime,
                'vendors-maplibre': message.mapEngine,
                'vendors-node-modules': message.sharedLibraries,
                'tinker-chest': message.tinkerChest,
                ui: message.interface,
                'web-ui': message.interface,
                apparatus: message.apparatus,
                'web-apparatus': message.apparatus,
                machine: message.machineWard,
            };
            const libraryOrder = new Set(Object.values(bundleLabels));
            const gears = createProgressItem(message.aligningGears);
            gears.item.id = 'startup-gears';
            setProgressState(gears.indicator, 'pending');

            function createProgressItem(label) {
                const item = document.createElement('li');
                item.setAttribute('aria-atomic', 'true');
                const indicator = document.createElement('span');
                indicator.setAttribute('role', 'img');
                const name = document.createElement('span');
                name.textContent = label;
                item.append(indicator, name);
                return { item, indicator };
            }

            function setProgressState(indicator, state, accessibleLabel = message.statuses[state]) {
                if (indicator.dataset.state !== state || indicator.getAttribute('aria-label') !== accessibleLabel) {
                    indicator.dataset.state = state;
                    indicator.setAttribute('aria-label', accessibleLabel);
                    indicator.textContent = symbols[state];
                }
            }

            function stopTracking() {
                resourceObserver?.disconnect();
                document.removeEventListener('load', onResource, true);
                document.removeEventListener('error', onResource, true);
                document.removeEventListener('readystatechange', updateProgress);
                if (!progress.isConnected) {
                    window.removeEventListener('startup-gears', onGearStatus);
                }
            }

            function updateProgress() {
                if (!progress.isConnected) {
                    stopTracking();
                    return;
                }
                if (document.readyState === 'loading') {
                    return;
                }
                const scripts = [...document.scripts].filter((script) => script.src && script.defer);
                if (scripts.length === 0) {
                    return;
                }
                const groups = new Map();
                const downloads = new Map(performance.getEntriesByType('resource').map((entry) => [entry.name, entry]));
                for (const script of scripts) {
                    const name = script.src.split('/').pop().split('.')[0];
                    const label = Object.hasOwn(bundleLabels, name) ? bundleLabels[name] : message.sharedLibraries;
                    if (!groups.has(label)) {
                        groups.set(label, []);
                    }
                    groups.get(label).push(script);
                }
                for (const label of libraryOrder) {
                    const resources = groups.get(label);
                    if (!resources) {
                        continue;
                    }
                    let indicator = indicators.get(label);
                    if (!indicator) {
                        const row = createProgressItem(label);
                        indicator = row.indicator;
                        progress.insertBefore(row.item, gears.item.isConnected ? gears.item : null);
                        indicators.set(label, indicator);
                    }
                    let state = 'pending';
                    if (resources.some((script) => failed.has(script) || downloads.get(script.src)?.responseStatus >= 400)) {
                        state = 'failed';
                    } else if (resources.every((script) => loaded.has(script) || downloads.has(script.src))) {
                        state = 'downloaded';
                    }
                    setProgressState(indicator, state);
                }
                if (!gears.item.isConnected) {
                    progress.append(gears.item);
                }
                if (document.readyState === 'complete') {
                    stopTracking();
                }
            }

            function onResource(event) {
                const script = event.target;
                if (script instanceof HTMLScriptElement && script.src && script.defer) {
                    (event.type === 'load' ? loaded : failed).add(script);
                    updateProgress();
                }
            }

            function onGearStatus(event) {
                if (!(event instanceof CustomEvent) || typeof event.detail !== 'string' || !Object.hasOwn(symbols, event.detail)) {
                    return;
                }
                updateProgress();
                setProgressState(gears.indicator, event.detail);
                if (event.detail !== 'pending') {
                    window.removeEventListener('startup-gears', onGearStatus);
                }
            }

            document.addEventListener('load', onResource, true);
            document.addEventListener('error', onResource, true);
            document.addEventListener('readystatechange', updateProgress);
            window.addEventListener('startup-gears', onGearStatus);
            resourceObserver?.observe({ entryTypes: ['resource'] });
        })();
    </script>
</body>

</html>
