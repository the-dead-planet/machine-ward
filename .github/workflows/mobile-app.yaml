name: Mobile app checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  typecheck-mobile:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-typecheck-mobile-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-yarn

      - name: Typecheck app and shared mobile UI
        run: yarn typecheck:mobile:once

      - name: Typecheck native apparatus tests
        run: yarn exec tsc --noEmit -p apparatus/mobile

      - name: Typecheck gear mobile packages
        run: |
          for dir in gears/*/mobile; do
            if [ -d "$dir" ]; then
              echo "Typechecking $dir..."
              yarn exec tsc --noEmit -p "$dir"
            fi
          done
        shell: bash

      - name: Run mobile platform tests
        run: yarn test:mobile:platform

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Fresh NDK installs must not invalidate unchanged compiler binaries.
      CCACHE_COMPILERCHECK: content
    concurrency:
      group: ${{ github.workflow }}-android-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-yarn

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Cache native C++ compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-android-x86_64
          max-size: 1G

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Build debug app and instrumentation APKs
        run: bash ./app-mobile/android/gradlew -p app-mobile/android :app:assembleDebug :app:assembleDebugAndroidTest --build-cache -PreactNativeArchitectures=x86_64

      - name: Enable hardware acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Start Metro for the debug test activity
        working-directory: app-mobile
        run: yarn start > "$RUNNER_TEMP/metro.log" 2>&1 &

      - name: Run native gear instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb reverse tcp:8081 tcp:8081
            bash ./app-mobile/android/gradlew -p app-mobile/android :app:connectedDebugAndroidTest --build-cache -PreactNativeArchitectures=x86_64

      - name: Upload native test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-results
          path: |
            app-mobile/android/app/build/reports/androidTests/
            app-mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
